name: Update market data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run script
        run: python scripts/update_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -f data/vix.json ]; then
            git add data/vix.json
            git commit -m "Update VIX data" || echo "No changes"
            git push
          else
            echo "data/vix.json not found - skip commit"
          fi
