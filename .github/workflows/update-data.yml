name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"  # 매일 UTC 00:10 (KST 09:10)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scripts/update_data.py

- run: |
    git config user.name "github-actions"
    git config user.email "github-actions@github.com"

    # ✅ 파일이 있을 때만 add (없으면 에러 안 내고 통과)
    if [ -f data/vix.json ]; then
      git add data/vix.json
      git commit -m "Update VIX data" || echo "No changes"
      git push
    else
      echo "data/vix.json not found - skip commit"
    fi
